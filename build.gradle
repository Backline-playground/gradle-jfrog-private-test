// BKLN-2092 end-to-end test (Gradle counterpart of maven-jfrog-private-test).
//
// The JFrog maven-test virtual repo is the only repository declared here. It
// serves `com.backline.test:demo-lib` and proxies Maven Central for everything
// else, so nothing in this build resolves without reaching it.
//
// No credentials in this file: Backline's runner injects
// $HOME/.gradle/init.gradle at job-start time, which attaches the tenant's
// configured credentials to every repository on this host.
//
// For local development outside Backline, put those credentials in your own
// $HOME/.gradle/init.gradle (or pass `--init-script <path>`) — see README.

plugins {
    id 'java'
}

group = 'com.backline.test'
version = '1.0.0'

repositories {
    maven {
        url = uri('https://backlineai.jfrog.io/artifactory/maven-test/')
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    // Transitively pulls log4j-core 2.14.1 (CVE-2021-44228) — what the trivy
    // report flags. demo-lib 2.0.0 is also published in JFrog with log4j-core
    // 2.17.1 as a known-safe upgrade target for Backline's planning step.
    implementation 'com.backline.test:demo-lib:1.0.0'
}
