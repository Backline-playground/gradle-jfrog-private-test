// BKLN-2092 end-to-end test (Gradle counterpart of maven-jfrog-private-test).
//
// No `repositories { ... }` block here on purpose: Backline's runner injects
// $HOME/.gradle/init.gradle at job-start time, which adds the customer's
// configured JFrog Maven-layout repo to `allprojects.repositories` with a
// Bearer-auth httpHeaderCredentials block. That's how the resolver fetches
// `com.backline.test:demo-lib:1.0.0` from the private maven-test virtual repo.
//
// For local development outside Backline, configure your own
// $HOME/.gradle/init.gradle (or pass `--init-script <path>`) pointing at the
// same registry — see README.

plugins {
    id 'java'
}

group = 'com.backline.test'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    // Transitively pulls log4j-core 2.14.1 (CVE-2021-44228) — what the trivy
    // report flags. demo-lib 2.0.0 is also published in JFrog with log4j-core
    // 2.17.1 as a known-safe upgrade target for Backline's planning step.
    implementation 'com.backline.test:demo-lib:2.0.0'
}
